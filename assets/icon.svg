<style>.o{transform-box:fill-box;transform-origin:center}
.t{transform-box:fill-box;transform-origin:center top}
#bg{animation:drop 640ms linear 0ms both;}
#icon{animation:shake 3140ms ease-out 0ms none;}
#sw{animation:sweep 1050ms cubic-bezier(.65,0,.25,1) 650ms both;}
#c2{animation:iris 620ms cubic-bezier(.34,1.56,.64,1) 1500ms both;--r:-140deg}
#c3{animation:iris 620ms cubic-bezier(.34,1.56,.64,1) 1580ms both;--r:120deg}
#c4{animation:iris 620ms cubic-bezier(.34,1.56,.64,1) 1660ms both;--r:-100deg}
#c5{animation:iris 620ms cubic-bezier(.34,1.56,.64,1) 1740ms both;--r:90deg}
#c6{animation:iris 820ms cubic-bezier(.34,1.56,.64,1) 1830ms both;--r:-540deg}
#s7{animation:rail 560ms cubic-bezier(.34,1.56,.64,1) 2000ms both;--x:70px}
#s8{animation:rail 560ms cubic-bezier(.34,1.56,.64,1) 2000ms both;--x:-70px}
#g9{animation:shutter 420ms cubic-bezier(.16,1,.3,1) 2250ms both;}
#l10{animation:press 480ms cubic-bezier(.34,1.56,.64,1) 2450ms both;}
#l11{animation:press 480ms cubic-bezier(.34,1.56,.64,1) 2520ms both;}
#l12{animation:press 480ms cubic-bezier(.34,1.56,.64,1) 2520ms both;}
#l13{animation:press 480ms cubic-bezier(.34,1.56,.64,1) 2590ms both;}
#l14{animation:press 480ms cubic-bezier(.34,1.56,.64,1) 2590ms both;}
#l15{animation:press 480ms cubic-bezier(.34,1.56,.64,1) 2660ms both;}
#l16{animation:press 480ms cubic-bezier(.34,1.56,.64,1) 2660ms both;}
#cap{animation:piston 520ms cubic-bezier(.16,1,.3,1) 3000ms both;}
#p1{animation:puff 520ms ease-out 3380ms forwards;--dx:-8px;--dy:-70px}
#p2{animation:puff 520ms ease-out 3460ms forwards;--dx:10px;--dy:-80px}
#p3{animation:puff 520ms ease-out 3540ms forwards;--dx:2px;--dy:-64px}
#ring{animation:pulse 900ms ease-out 3000ms forwards;}
@keyframes drop{0%{transform:translateY(-620px) scale(1,1.08);animation-timing-function:cubic-bezier(.55,0,1,.6)}62%{transform:translateY(0) scale(1,1.08);animation-timing-function:ease-out}78%{transform:translateY(0) scale(1.05,.93);animation-timing-function:ease-in-out}100%{transform:translateY(0) scale(1,1)}}
@keyframes shake{0%,13.06%{transform:translate(0,0)}15.82%{transform:translate(0,7px)}18.58%{transform:translate(0,-3px)}21.34%,92.36%{transform:translate(0,0)}94.9%{transform:translate(0,6px)}97.45%{transform:translate(0,-2px)}100%{transform:translate(0,0)}}
@keyframes sweep{from{stroke-dashoffset:1572}to{stroke-dashoffset:0}}
@keyframes iris{from{transform:scale(0) rotate(var(--r))}to{transform:scale(1) rotate(0deg)}}
@keyframes rail{from{transform:translate(var(--x),-70px) scale(0)}to{transform:translate(0,0) scale(1)}}
@keyframes shutter{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes press{from{transform:translateY(-60px) scaleY(0)}to{transform:translateY(0) scaleY(1)}}
@keyframes piston{0%{transform:translateY(46px);opacity:0}.1%{opacity:1}70%{transform:translateY(-12px)}100%{transform:translateY(0);opacity:1}}
@keyframes puff{from{transform:translate(0,0) scale(.6);opacity:.85}to{transform:translate(var(--dx),var(--dy)) scale(3.2);opacity:0}}
@keyframes pulse{from{transform:scale(.3);opacity:.55}to{transform:scale(3.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
