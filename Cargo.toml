[package]
name = "locomotive"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Locomotive"
license = "MIT"
build = "build.rs"

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = [
    "thread-pool",
    "tiny-skia",
    "fira-sans",
    "svg",
    "image",
] }
lucide-icons = { version = "=1.27.0", features = ["iced"] }

[build-dependencies]
winresource = "=0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true